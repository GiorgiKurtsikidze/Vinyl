<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Updates</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Daily Updates</h1>
            <p class="subtitle">Update and manage your daily data</p>
        </header>

        <div class="main-content">
            <section class="form-section">
                <h2>Add New Update</h2>
                <form id="updateForm">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" placeholder="Enter update title" required>
                    </div>
                    <div class="form-group">
                        <label for="content">Content</label>
                        <textarea id="content" name="content" rows="5" placeholder="Enter update details" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Update</button>
                </form>
            </section>

            <section class="entries-section">
                <h2>Recent Updates</h2>
                <div id="entriesList" class="entries-list">
                    <p class="loading">Loading entries...</p>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
